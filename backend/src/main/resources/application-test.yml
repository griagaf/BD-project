spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    jwt:
      secret: test-secret-test-secret-test-secret-test-secret
      access-ttl-minutes: 15
      refresh-ttl-days: 1
  cors:
    allowed-origins:
      - http://localhost:3000
